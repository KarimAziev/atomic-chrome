name: CI

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs-version:
          - "27.2"
          - "28.2"
          - "29.4"
          - '30.1'
          - '30.2'
          - 'snapshot'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Emacs
        uses: purcell/setup-emacs@master
        with:
          version: ${{matrix.emacs_version}}

      - name: Install dependencies
        run: |
          git clone --depth 1 https://github.com/ahyatt/emacs-websocket.git ../emacs-websocket

      - name: Run ERT test suite
        env:
          EMACSPKG: ${{ matrix.emacs-version }}
        run: |
          emacs -Q --batch \
                -L . \
                -L test \
                -l test/atomic-chrome-tests.el \
                -f ert-run-tests-batch-and-exit
